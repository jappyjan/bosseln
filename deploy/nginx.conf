# Static hosting for the Boßeln PWA.
# PWA-critical bits: never cache the service worker or the entry point, keep
# fingerprinted assets immutable, serve the webmanifest with the right MIME type.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
    }
    default_type application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;

    # the service worker must be revalidated on every load, otherwise updates stall
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }

    # workbox runtime is fingerprinted too — match any hash
    location ~ ^/workbox-[A-Za-z0-9_-]+\.js$ {
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=604800" always;
    }

    # SPA fallback (the app is a single page; deep links land on index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
