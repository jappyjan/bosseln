# Static hosting for the Boßeln PWA.
#
# PWA-critical bits: the service worker and the entry point must never be cached,
# fingerprinted assets must be immutable, and the webmanifest needs the right MIME
# type.
#
# Note on nginx: a `location` that defines its own add_header *replaces* the whole
# inherited set from the server level. That is why the caching rules live in a single
# server-level add_header fed by a `map` — so the security headers below are never
# silently dropped.

map $uri $bosseln_cache_control {
    default                        "no-cache";
    ~^/assets/                     "public, max-age=31536000, immutable";
    ~^/icons/                      "public, max-age=604800";
    ~^/workbox-[A-Za-z0-9_-]+\.js$ "no-cache";
    ~^/(index\.html|sw\.js|manifest\.webmanifest)$ "no-cache, no-store, must-revalidate";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
    }
    default_type application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml;

    add_header Cache-Control $bosseln_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=15552000" always;

    # SPA fallback (the app is a single page; deep links land on index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
